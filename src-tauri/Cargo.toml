[package]
name = "ollama-desktop"
version = "0.1.0"
description = "Client de bureau léger et respectueux de la vie privée pour Ollama"
authors = ["r0mish"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ollama_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots", "http2", "charset", "multipart"] }
tokio = { version = "1", features = ["sync", "macros", "process", "io-util", "time", "rt"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
base64 = "0.22"
html2text = "0.17"
similar = "2"
ignore = "0.4"
regex = "1"
pdf-extract = "0.12"
cpal = "0.18"
chacha20poly1305 = "0.10"

[dev-dependencies]
# Faux serveur Ollama des tests d'intégration du client HTTP.
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
